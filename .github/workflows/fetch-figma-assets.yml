# Temporary helper for the home v3 draft: downloads the Figma export URLs listed in
# .figma-assets/manifest.json into images/home-v3/, converts large PNG photos to WebP and
# commits them to the same branch. Removed before merge.
name: fetch-figma-assets
on:
  push:
    branches: [feat/home-draft-v3]
    paths: ['.figma-assets/manifest.json']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -e
          mkdir -p images/home-v3
          : > images/home-v3/_fetch-log.txt
          python3 -c "import json;[print(k, v) for k, v in json.load(open('.figma-assets/manifest.json')).items()]" | while read name url; do
            code=$(curl -sS -L -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -o "images/home-v3/$name" -w "%{http_code} %{size_download} %{content_type}" "$url" || echo "curl-failed")
            echo "$name $code" >> images/home-v3/_fetch-log.txt
          done
          find images/home-v3 -type f -size 0 -delete
          sudo apt-get install -y -qq webp >/dev/null
          cd images/home-v3
          for f in *.png; do
            s=$(stat -c%s "$f")
            if [ "$s" -gt 150000 ]; then cwebp -quiet -q 82 "$f" -o "${f%.png}.webp" && rm "$f"; fi
          done
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add images/home-v3
          git commit -m "home v3 draft: Figma assets" || echo "nothing to commit"
          git push
